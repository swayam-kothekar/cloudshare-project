<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="cloudshare-gradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="50%" stop-color="#c026d3" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="cloud-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <filter id="subtle-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#3b0764" flood-opacity="0.32" />
    </filter>
  </defs>

  <!-- Background container with brand gradient -->
  <rect width="64" height="64" rx="16" fill="url(#cloudshare-gradient)" />

  <!-- Cloud body with soft drop shadow -->
  <path
    d="M19.5 45 C15.36 45 12 41.64 12 37.5 C12 33.64 14.93 30.45 18.75 30.05 C20.08 23.65 25.54 18.5 32.2 18.5 C39.14 18.5 44.85 23.95 45.68 30.7 C49.32 31.35 52 34.52 52 38.3 C52 42.44 48.64 45 44.5 45 Z"
    fill="url(#cloud-fill)"
    filter="url(#subtle-shadow)"
  />
</svg>
